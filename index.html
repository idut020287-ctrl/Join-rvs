<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabung MAJU BERSAMA RVS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); min-height: 100-vh; font-family: sans-serif; }
        .form-card { background: rgba(255, 255, 255, 0.98); border-radius: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div class="form-card w-full max-w-lg p-8">
        <div class="text-center mb-8">
            <div class="bg-indigo-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="user-plus" class="text-indigo-600 w-10 h-10"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800">PENDAFTARAN MEMBER</h1>
            <p class="text-slate-500 uppercase tracking-widest text-sm font-bold">Maju Bersama RVS</p>
        </div>

        <div id="reg-form" class="space-y-5">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase ml-1">Nama Lengkap</label>
                <input id="reg-name" type="text" class="w-full p-4 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Masukkan nama sesuai KTP">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase ml-1">Alamat Email</label>
                <input id="reg-email" type="email" class="w-full p-4 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="contoh@email.com">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase ml-1">Pilih Paket Bisnis</label>
                <select id="reg-level" class="w-full p-4 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 appearance-none">
                    <option value="Bronze">BRONZE - Rp 1.000.000</option>
                    <option value="Silver">SILVER - Rp 3.000.000</option>
                    <option value="Gold">GOLD - Rp 7.000.000</option>
                    <option value="Platinum">PLATINUM - Rp 15.000.000</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase ml-1">ID Referral / Upline (Opsional)</label>
                <select id="reg-upline" class="w-full p-4 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 appearance-none">
                    <option value="">-- Tidak Ada (Daftar Pusat) --</option>
                </select>
            </div>

            <button onclick="registerMember()" id="btn-submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all">
                GABUNG SEKARANG
            </button>
        </div>

        <div id="success-msg" class="hidden text-center py-10">
            <div class="bg-emerald-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check-circle-2" class="text-emerald-600 w-12 h-12"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Pendaftaran Berhasil!</h2>
            <p class="text-slate-500 mt-2 mb-6">Admin akan segera menghubungi Anda untuk proses aktivasi akun.</p>
            <button onclick="location.reload()" class="text-indigo-600 font-bold underline">Daftar Member Lainnya</button>
        </div>
    </div>

    <script>

        const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "rvs-project.firebaseapp.com",
  projectId: "rvs-project",
  storageBucket: "rvs-project.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:12345:web:abcde"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const PACKAGES = {
            'Bronze': { profit: 150000, bonus: 100000 },
            'Silver': { profit: 500000, bonus: 300000 },
            'Gold': { profit: 1250000, bonus: 700000 },
            'Platinum': { profit: 3000000, bonus: 1500000 }
        };

        // Load Upline List Automatically
        async function loadUplines() {
            await auth.signInAnonymously();
            db.collection("members").get().then(snapshot => {
                let html = '<option value="">-- Tidak Ada (Daftar Pusat) --</option>';
                snapshot.forEach(doc => {
                    html += `<option value="${doc.id}">${doc.data().name}</option>`;
                });
                document.getElementById('reg-upline').innerHTML = html;
            });
        }

        async function registerMember() {
            const btn = document.getElementById('btn-submit');
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const level = document.getElementById('reg-level').value;
            const uplineId = document.getElementById('reg-upline').value;

            if(!name || !email) return alert("Silakan lengkapi Nama dan Email Anda!");

            btn.disabled = true;
            btn.innerText = "MEMPROSES...";

            const pkg = PACKAGES[level];
            const newMember = {
                name, email, level,
                totalEarnings: pkg.profit,
                uplineId: uplineId || null,
                createdAt: Date.now()
            };

            try {
                await db.collection("members").add(newMember);
                if(uplineId) {
                    await db.collection("members").doc(uplineId).update({
                        totalEarnings: firebase.firestore.FieldValue.increment(pkg.bonus)
                    });
                }
                document.getElementById('reg-form').classList.add('hidden');
                document.getElementById('success-msg').classList.remove('hidden');
            } catch (err) {
                alert("Terjadi kesalahan, coba lagi nanti.");
                btn.disabled = false;
                btn.innerText = "GABUNG SEKARANG";
            }
        }

        loadUplines();
        lucide.createIcons();
    </script>
</body>
</html>
